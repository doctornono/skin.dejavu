name: Bootstrap from Estuary Omega

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: contains(github.event.head_commit.message, '[bootstrap-estuary-omega]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skin.dejaVu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Estuary Omega
        env:
          ESTUARY_SHA: f8815ee40f49a700c047982d752be4b2a61420e2
        run: |
          set -euo pipefail
          rm -rf /tmp/xbmc
          mkdir -p /tmp/xbmc
          curl -L --fail --retry 3 "https://github.com/xbmc/xbmc/archive/$ESTUARY_SHA.tar.gz" -o /tmp/xbmc.tar.gz
          tar -xzf /tmp/xbmc.tar.gz -C /tmp/xbmc
          ESTUARY_DIR="$(find /tmp/xbmc -maxdepth 2 -type d -path '*/addons/skin.estuary' | head -n 1)"
          test -n "$ESTUARY_DIR"
          test -f "$ESTUARY_DIR/addon.xml"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$ESTUARY_DIR"/. .

      - name: Convert manifest to skin.dejavu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("addon.xml")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '<addon id="skin.estuary" version="4.0.0" name="Estuary" provider-name="phil65, Ichabod Fletchman">',
              '<addon id="skin.dejavu" version="0.2.0" name="dejaVu" provider-name="dejaVu contributors; based on Estuary by phil65 and Piers">'
          )
          text = text.replace(
              '<source>https://github.com/xbmc/skin.estuary/</source>',
              '<source>https://github.com/doctornono/skin.dejavu</source>'
          )
          p.write_text(text, encoding="utf-8")
          PY

      - name: Add dejaVu baseline notes
        run: |
          cat > DEJAVU_BASELINE.md <<'EOF'
          # skin.dejaVu — Estuary Omega baseline

          `skin.dejaVu` is derived from the Kodi 21 Omega version of Estuary.

          Baseline source:
          - Repository: https://github.com/xbmc/xbmc
          - Path: `addons/skin.estuary`
          - Omega commit: `f8815ee40f49a700c047982d752be4b2a61420e2`
          - Kodi GUI API: `xbmc.gui 5.17.0`
          - Estuary version: `4.0.0`

          The Estuary source, runtime surfaces, resources, dialogs, views and native Kodi integration are intentionally preserved as the compatibility baseline.

          The next development work will replace or extend the baseline progressively with the dejaVu experience.

          License and attribution from Estuary are retained in this repository.
          EOF
          cat > DEV.md <<'EOF'
          # Development

          The local Kodi installation uses a Windows junction directly to this repository:

          `C:\Users\conta\AppData\Roaming\Kodi\addons\skin.dejavu`
          ->
          `D:\Developpement\dejavu-kodi-addons\skin.dejavu`

          Therefore the repository itself is the active Kodi skin. Do not run an installer that copies or deletes the addon directory.

          Local workflow:
          1. edit the repository;
          2. `git status`;
          3. commit and push to `main`;
          4. reload or restart Kodi when required.

          `skin.dejavu` is derived from Estuary Omega/Kodi 21. Preserve the native Kodi runtime until each replacement is validated.
          EOF

      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/bootstrap-estuary.yml

      - name: Commit baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: reset skin.dejavu to Estuary Omega baseline" || exit 0
          git push origin main